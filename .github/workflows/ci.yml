name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # 原 code-quality.yml 的顶层 env
  BUILD_TYPE: Debug

jobs:
  # Ubuntu with GCC
  build-gcc:
    name: Ubuntu (GCC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          wget \
          python3 \
          python3-pip

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Python test dependencies (Bolt integration tests)
      run: pip install neo4j pytest --break-system-packages

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        # 只缓存二进制包缓存（~/.cache/vcpkg/archives，约 1GB）：安装时 vcpkg 按 ABI 直接解包，
        # 不再源码重建依赖。vcpkg 工具目录由 actions/checkout 的 submodule 提供（固定 2cf2bcc），
        # 不缓存它 —— 其 buildtrees/packages/downloads 单次可达数 GB，会挤爆仓库 10GB 缓存额度，
        # 连带淘汰 ccache/基线等条目（这也是主键长期 miss 的原因之一）。
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-archives-gcc-${{ hashFiles('vcpkg.json') }}
        # 主键一 miss（PR 缓存随 PR 关闭被删除、vcpkg.json 改动等）时回退到旧条目，
        # 避免从零源码重建；vcpkg 会按 ABI 校验每个包，回退只会部分复用，不会用错。
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-gcc-

    - name: Bootstrap vcpkg
      # 直接用 submodule 里的 vcpkg（固定 2cf2bcc）就地 bootstrap，不再使用 lukka/run-vcpkg：
      # 该 action 会把 vcpkg 的二进制缓存接管到 GitHub Actions 的 x-gha 后端，而固定版本的
      # vcpkg 已移除 x-gha，依赖包因此从不写入 ~/.cache/vcpkg/archives（actions/cache 无内容
      # 可存，作业退化成每次源码重建全部依赖）。
      run: |
        if [ -f "vcpkg/vcpkg" ]; then
          echo "Using existing vcpkg binary"
        else
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        ./vcpkg/vcpkg version

    - name: Debug vcpkg environment
      run: |
        echo "=== VCPKG Environment Variables ==="
        env | grep VCPKG || echo "No VCPKG environment variables found"
        echo ""
        echo "=== VCPKG Binary Cache Directory ==="
        ls -la ~/.cache/vcpkg/archives/ 2>/dev/null || echo "Cache directory not found"
        echo ""
        echo "=== VCPKG Version ==="
        ${{ github.workspace }}/vcpkg/vcpkg version

    - name: Configure CMake
      # CI-only: strip final test/server binaries to keep runner disk usage
      # within GitHub's limits. Debug symbols are not needed for green/red
      # test results; local debug builds remain unchanged.
      run: cmake --preset=release -DCMAKE_EXE_LINKER_FLAGS="-s"

    - name: Verify vcpkg binary cache
      # 判据：vcpkg 必须把编译好的依赖包写进默认的本地二进制缓存（~/.cache/vcpkg/archives），
      # 否则 actions/cache 无内容可存，作业会退化成每次源码重建全部依赖。
      run: |
        dir="$HOME/.cache/vcpkg/archives"
        if [ ! -d "$dir" ]; then
          echo "::error::vcpkg 二进制缓存目录不存在：$dir"
          exit 1
        fi
        count=$(find "$dir" -name '*.zip' | wc -l)
        echo "vcpkg 二进制缓存：$count 个包，$(du -sh "$dir" | cut -f1)，路径 $dir"
        if [ "$count" -eq 0 ]; then
          echo "::error::$dir 为空，依赖没有被缓存"
          exit 1
        fi

    - name: Build
      run: cmake --build --preset=release

    - name: Check library linking
      working-directory: build/release
      run: |
        ldd eugraph_tests
        ldd libeugraph_lib.a || true

  # Code Coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          wget \
          gcovr \
          python3 \
          python3-pip

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Python test dependencies (Bolt integration tests)
      run: pip install neo4j pytest --break-system-packages

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        # 只缓存二进制包缓存（~/.cache/vcpkg/archives，约 1GB）：安装时 vcpkg 按 ABI 直接解包，
        # 不再源码重建依赖。vcpkg 工具目录由 actions/checkout 的 submodule 提供（固定 2cf2bcc），
        # 不缓存它 —— 其 buildtrees/packages/downloads 单次可达数 GB，会挤爆仓库 10GB 缓存额度，
        # 连带淘汰 ccache/基线等条目（这也是主键长期 miss 的原因之一）。
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-archives-coverage-${{ hashFiles('vcpkg.json') }}
        # 主键一 miss（PR 缓存随 PR 关闭被删除、vcpkg.json 改动等）时回退到旧条目，
        # 避免从零源码重建；vcpkg 会按 ABI 校验每个包，回退只会部分复用，不会用错。
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-coverage-

    - name: Bootstrap vcpkg
      # 直接用 submodule 里的 vcpkg（固定 2cf2bcc）就地 bootstrap，不再使用 lukka/run-vcpkg：
      # 该 action 会把 vcpkg 的二进制缓存接管到 GitHub Actions 的 x-gha 后端，而固定版本的
      # vcpkg 已移除 x-gha，依赖包因此从不写入 ~/.cache/vcpkg/archives（actions/cache 无内容
      # 可存，作业退化成每次源码重建全部依赖）。
      run: |
        if [ -f "vcpkg/vcpkg" ]; then
          echo "Using existing vcpkg binary"
        else
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        ./vcpkg/vcpkg version

    - name: Configure CMake with Coverage
      run: cmake --preset=coverage

    - name: Verify vcpkg binary cache
      # 判据：vcpkg 必须把编译好的依赖包写进默认的本地二进制缓存（~/.cache/vcpkg/archives），
      # 否则 actions/cache 无内容可存，作业会退化成每次源码重建全部依赖。
      run: |
        dir="$HOME/.cache/vcpkg/archives"
        if [ ! -d "$dir" ]; then
          echo "::error::vcpkg 二进制缓存目录不存在：$dir"
          exit 1
        fi
        count=$(find "$dir" -name '*.zip' | wc -l)
        echo "vcpkg 二进制缓存：$count 个包，$(du -sh "$dir" | cut -f1)，路径 $dir"
        if [ "$count" -eq 0 ]; then
          echo "::error::$dir 为空，依赖没有被缓存"
          exit 1
        fi

    - name: Build
      run: cmake --build --preset=coverage

    - name: Run tests
      run: ctest --preset=coverage

    - name: Generate coverage report
      working-directory: build/coverage
      run: |
        set -o pipefail
        gcovr --xml-pretty --exclude-unreachable-branches --print-summary \
          --output coverage.xml \
          --root ${{ github.workspace }} \
          --filter '${{ github.workspace }}/src' \
          --exclude '${{ github.workspace }}/src/service/thrift/gen-cpp2/.*' \
          --exclude '${{ github.workspace }}/src/query/parser/generated/.*' | tee gcovr-summary.txt
        # 同一份 summary 写成 markdown，直接贴到 PR（不依赖 Codecov 认证）
        {
          echo "### Coverage Report"
          echo
          echo '```'
          cat gcovr-summary.txt
          echo '```'
          echo
          echo "commit: `${{ github.sha }}`"
        } > coverage-comment.md
        # 顺带确认采集真的开了、且有 .gcda，避免"静默 0%"
        grep -E '^ENABLE_COVERAGE' "${{ github.workspace }}/build/coverage/CMakeCache.txt" || true
        echo "gcda files: $(find "${{ github.workspace }}/build/coverage" -name '*.gcda' | wc -l)"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/coverage/coverage.xml
        flags: unittests
        name: eugraph-coverage
        fail_ci_if_error: false
        verbose: true

  # Ubuntu with Clang
    - name: Post coverage report to PR
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && hashFiles('build/coverage/coverage-comment.md') != '' && always()
      with:
        path: build/coverage/coverage-comment.md
        header: coverage-report

  build-clang:
    name: Ubuntu (Clang)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          clang \
          build-essential \
          git \
          pkg-config \
          wget \
          python3 \
          python3-pip

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Python test dependencies (Bolt integration tests)
      run: pip install neo4j pytest --break-system-packages

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        # 只缓存二进制包缓存（~/.cache/vcpkg/archives）：见 build-gcc 作业同名步骤的说明。
        # 本作业的依赖用 GCC 预装（--triplet x64-linux --overlay-ports=ports），与 build-gcc/coverage
        # 同 ABI，因此使用独立 key（不共用条目，避免"先写入者定稿"导致后续作业永远无法持久化）。
        # 名字用 buildclang 而不是 clang：restore-keys 是按前缀匹配的，
        # `-vcpkg-archives-clang-` 曾经是 `-vcpkg-archives-clang-tidy-` 的前缀，导致本作业回退拿到
        # clang-tidy 的 x64-linux-release 条目（ABI 不同、一个包都用不上），并被当成自己的内容存了下来。
        # 新增作业时注意：key 前缀不得是其它作业 key 的前缀。
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-archives-buildclang-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-buildclang-

    - name: Bootstrap vcpkg
      # 直接用 submodule 里的 vcpkg（固定 2cf2bcc）就地 bootstrap，不再使用 lukka/run-vcpkg：
      # 该 action 会把 vcpkg 的二进制缓存接管到 GitHub Actions 的 x-gha 后端，而固定版本的
      # vcpkg 已移除 x-gha，依赖包因此从不写入 ~/.cache/vcpkg/archives（actions/cache 无内容
      # 可存，作业退化成每次源码重建全部依赖）。
      run: |
        if [ -f "vcpkg/vcpkg" ]; then
          echo "Using existing vcpkg binary"
        else
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        ./vcpkg/vcpkg version

    - name: Debug vcpkg environment
      run: |
        echo "=== VCPKG Environment Variables ==="
        env | grep VCPKG || echo "No VCPKG environment variables found"
        echo ""
        echo "=== VCPKG Binary Cache Directory ==="
        ls -la ~/.cache/vcpkg/archives/ 2>/dev/null || echo "Cache directory not found"
        echo ""
        echo "=== VCPKG Version ==="
        ${{ github.workspace }}/vcpkg/vcpkg version

    # 依赖用 GCC 构建（与 gcc/asan/ubsan 作业共用同一份产物），只有我们的代码用 clang 编译。
    #
    # 为什么必须这样：folly 的 Portability.h 按编译器/标准决定 FOLLY_HAS_COROUTINES，
    # clang 编 folly 时该宏为 0（folly 自己的 CMake 用 C++17 探测），于是 libfolly.a 里
    # 根本没有 folly/coro 模块；而我们的 TU 以 C++20 编译、看到 FOLLY_HAS_COROUTINES=1，
    # 引用 folly::coro::*（以及 fbthrift 里同样条件编译的 HandlerCallbackBase::*）→ 链接必然
    # undefined reference。CI 实测：clang 装的 folly 里 coro::Mutex/unlock、Baton、 
    # resumeCoroutineWithNewAsyncStackRoot 计数全为 0，archive 只有 188MB（GCC 那份 350MB）。
    - name: Install vcpkg dependencies (GCC)
      run: |
        ./vcpkg/vcpkg install --triplet x64-linux \
          --overlay-ports="$PWD/ports" \
          --x-install-root="$PWD/build/clang-release/vcpkg_installed"

    - name: Verify vcpkg binary cache
      # 判据：vcpkg 必须把编译好的依赖包写进默认的本地二进制缓存（~/.cache/vcpkg/archives），
      # 否则 actions/cache 无内容可存，作业会退化成每次源码重建全部依赖。
      run: |
        dir="$HOME/.cache/vcpkg/archives"
        if [ ! -d "$dir" ]; then
          echo "::error::vcpkg 二进制缓存目录不存在：$dir"
          exit 1
        fi
        count=$(find "$dir" -name '*.zip' | wc -l)
        echo "vcpkg 二进制缓存：$count 个包，$(du -sh "$dir" | cut -f1)，路径 $dir"
        if [ "$count" -eq 0 ]; then
          echo "::error::$dir 为空，依赖没有被缓存"
          exit 1
        fi

    - name: Configure CMake with Clang
      run: cmake --preset=clang-release -DVCPKG_MANIFEST_INSTALL=OFF

    - name: Build
      run: cmake --build --preset=clang-release

  # Format Check with clang-format
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    container:
      image: silkeh/clang:18

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show clang-format version
      run: clang-format --version

    - name: Run format check
      run: |
        chmod +x ./scripts/check-format.sh
        ./scripts/check-format.sh

  # Address Sanitizer
  asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          ninja-build \
          ccache \
          maven \
          python3 \
          python3-pip \
          python3-venv

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Neo4j Java driver
      run: |
        mkdir -p "$RUNNER_TEMP/neo4j-driver"
        cat > "$RUNNER_TEMP/neo4j-driver/pom.xml" <<'EOF'
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>eugraph</groupId>
          <artifactId>bolt-java-driver</artifactId>
          <version>1.0</version>
          <dependencies>
            <dependency>
              <groupId>org.neo4j.driver</groupId>
              <artifactId>neo4j-java-driver</artifactId>
              <version>5.28.14</version>
            </dependency>
          </dependencies>
        </project>
        EOF
        mvn -q -f "$RUNNER_TEMP/neo4j-driver/pom.xml" dependency:copy-dependencies -DoutputDirectory="$RUNNER_TEMP/neo4j-driver/lib"
        sudo mkdir -p /usr/share/neo4j/lib
        sudo cp "$RUNNER_TEMP/neo4j-driver/lib/"*.jar /usr/share/neo4j/lib/

    - name: Install Python test dependencies (Bolt integration tests)
      run: pip install neo4j pytest --break-system-packages

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-asan-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-asan-

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        # 只缓存二进制包缓存（~/.cache/vcpkg/archives，约 1GB）：安装时 vcpkg 按 ABI 直接解包，
        # 不再源码重建依赖。vcpkg 工具目录由 actions/checkout 的 submodule 提供（固定 2cf2bcc），
        # 不缓存它 —— 其 buildtrees/packages/downloads 单次可达数 GB，会挤爆仓库 10GB 缓存额度，
        # 连带淘汰 ccache/基线等条目（这也是主键长期 miss 的原因之一）。
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-archives-asan-${{ hashFiles('vcpkg.json') }}
        # 主键一 miss（PR 缓存随 PR 关闭被删除、vcpkg.json 改动等）时回退到旧条目，
        # 避免从零源码重建；vcpkg 会按 ABI 校验每个包，回退只会部分复用，不会用错。
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-asan-

    - name: Bootstrap vcpkg
      # 直接用 submodule 里的 vcpkg（固定 2cf2bcc）就地 bootstrap，不再使用 lukka/run-vcpkg：
      # 该 action 会把 vcpkg 的二进制缓存接管到 GitHub Actions 的 x-gha 后端，而固定版本的
      # vcpkg 已移除 x-gha，依赖包因此从不写入 ~/.cache/vcpkg/archives（actions/cache 无内容
      # 可存，作业退化成每次源码重建全部依赖）。
      run: |
        if [ -f "vcpkg/vcpkg" ]; then
          echo "Using existing vcpkg binary"
        else
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        ./vcpkg/vcpkg version

    - name: Configure CMake with ASan
      run: |
        mkdir build
        cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DEUGRAPH_ENABLE_CCACHE=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_CXX_FLAGS_DEBUG="-O0" \
          -DCMAKE_C_FLAGS_DEBUG="-O0" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address -s" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address"

    - name: Verify vcpkg binary cache
      # 判据：vcpkg 必须把编译好的依赖包写进默认的本地二进制缓存（~/.cache/vcpkg/archives），
      # 否则 actions/cache 无内容可存，作业会退化成每次源码重建全部依赖。
      run: |
        dir="$HOME/.cache/vcpkg/archives"
        if [ ! -d "$dir" ]; then
          echo "::error::vcpkg 二进制缓存目录不存在：$dir"
          exit 1
        fi
        count=$(find "$dir" -name '*.zip' | wc -l)
        echo "vcpkg 二进制缓存：$count 个包，$(du -sh "$dir" | cut -f1)，路径 $dir"
        if [ "$count" -eq 0 ]; then
          echo "::error::$dir 为空，依赖没有被缓存"
          exit 1
        fi

    - name: Build
      run: |
        cd build
        ninja -j$(nproc)

    - name: Restore TCK baseline report
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: build/tck-baseline-report.md
        key: tck-baseline-report-${{ github.base_ref }}-${{ github.sha }}
        restore-keys: tck-baseline-report-${{ github.base_ref }}-

    - name: Restore TCK step baseline
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: build/tck-step-baseline.json
        key: tck-step-baseline-${{ github.base_ref }}-${{ github.sha }}
        restore-keys: tck-step-baseline-${{ github.base_ref }}-

    - name: Run tests with ASan
      working-directory: build
      run: |
        ctest --output-on-failure --verbose --output-junit junit.xml
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        TCK_REPORT_PATH: ${{ github.workspace }}/build/tck-report.md
        TCK_BASELINE_REPORT_PATH: ${{ github.workspace }}/build/tck-baseline-report.md
        TCK_STEP_RESULTS_PATH: ${{ github.workspace }}/build/tck-step-results.json
        TCK_STEP_BASELINE_PATH: ${{ github.workspace }}/build/tck-step-baseline.json
        # 相对 main 基线出现新增回归时让作业失败（默认关闭，本地运行不受影响）
        TCK_FAIL_ON_REGRESSION: 1

    - name: Publish unit test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && hashFiles('build/junit.xml') != ''
      with:
        files: build/junit.xml
        check_name: Unit Test Results
        comment_title: Unit Test Report

    - name: Post TCK report to PR
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && hashFiles('build/tck-report.md') != '' && always()
      with:
        path: build/tck-report.md
        header: tck-report

    - name: Save TCK baseline report
      if: github.event_name == 'push' && hashFiles('build/tck-report.md') != ''
      run: cp build/tck-report.md build/tck-baseline-report.md

    - name: Cache TCK baseline report
      if: github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: build/tck-baseline-report.md
        key: tck-baseline-report-${{ github.ref_name }}-${{ github.sha }}

    - name: Save TCK step baseline
      if: github.event_name == 'push' && hashFiles('build/tck-step-results.json') != ''
      run: cp build/tck-step-results.json build/tck-step-baseline.json

    - name: Cache TCK step baseline
      if: github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: build/tck-step-baseline.json
        key: tck-step-baseline-${{ github.ref_name }}-${{ github.sha }}

  # Undefined Behavior Sanitizer
  ubsan:
    name: Undefined Behavior Sanitizer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          ninja-build \
          ccache \
          maven \
          python3 \
          python3-pip \
          python3-venv

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Neo4j Java driver
      run: |
        mkdir -p "$RUNNER_TEMP/neo4j-driver"
        cat > "$RUNNER_TEMP/neo4j-driver/pom.xml" <<'EOF'
        <project xmlns="http://maven.apache.org/POM/4.0.0">
          <modelVersion>4.0.0</modelVersion>
          <groupId>eugraph</groupId>
          <artifactId>bolt-java-driver</artifactId>
          <version>1.0</version>
          <dependencies>
            <dependency>
              <groupId>org.neo4j.driver</groupId>
              <artifactId>neo4j-java-driver</artifactId>
              <version>5.28.14</version>
            </dependency>
          </dependencies>
        </project>
        EOF
        mvn -q -f "$RUNNER_TEMP/neo4j-driver/pom.xml" dependency:copy-dependencies -DoutputDirectory="$RUNNER_TEMP/neo4j-driver/lib"
        sudo mkdir -p /usr/share/neo4j/lib
        sudo cp "$RUNNER_TEMP/neo4j-driver/lib/"*.jar /usr/share/neo4j/lib/

    - name: Install Python test dependencies (Bolt integration tests)
      run: pip install neo4j pytest --break-system-packages

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-ubsan-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-ubsan-

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        # 只缓存二进制包缓存（~/.cache/vcpkg/archives，约 1GB）：安装时 vcpkg 按 ABI 直接解包，
        # 不再源码重建依赖。vcpkg 工具目录由 actions/checkout 的 submodule 提供（固定 2cf2bcc），
        # 不缓存它 —— 其 buildtrees/packages/downloads 单次可达数 GB，会挤爆仓库 10GB 缓存额度，
        # 连带淘汰 ccache/基线等条目（这也是主键长期 miss 的原因之一）。
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-archives-ubsan-${{ hashFiles('vcpkg.json') }}
        # 主键一 miss（PR 缓存随 PR 关闭被删除、vcpkg.json 改动等）时回退到旧条目，
        # 避免从零源码重建；vcpkg 会按 ABI 校验每个包，回退只会部分复用，不会用错。
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-ubsan-

    - name: Bootstrap vcpkg
      # 直接用 submodule 里的 vcpkg（固定 2cf2bcc）就地 bootstrap，不再使用 lukka/run-vcpkg：
      # 该 action 会把 vcpkg 的二进制缓存接管到 GitHub Actions 的 x-gha 后端，而固定版本的
      # vcpkg 已移除 x-gha，依赖包因此从不写入 ~/.cache/vcpkg/archives（actions/cache 无内容
      # 可存，作业退化成每次源码重建全部依赖）。
      run: |
        if [ -f "vcpkg/vcpkg" ]; then
          echo "Using existing vcpkg binary"
        else
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        ./vcpkg/vcpkg version

    - name: Configure CMake with UBSan
      run: |
        mkdir build
        cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DEUGRAPH_ENABLE_CCACHE=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined" \
          -DCMAKE_C_FLAGS="-fsanitize=undefined" \
          -DCMAKE_CXX_FLAGS_DEBUG="-O0" \
          -DCMAKE_C_FLAGS_DEBUG="-O0" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined -s" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=undefined"

    - name: Verify vcpkg binary cache
      # 判据：vcpkg 必须把编译好的依赖包写进默认的本地二进制缓存（~/.cache/vcpkg/archives），
      # 否则 actions/cache 无内容可存，作业会退化成每次源码重建全部依赖。
      run: |
        dir="$HOME/.cache/vcpkg/archives"
        if [ ! -d "$dir" ]; then
          echo "::error::vcpkg 二进制缓存目录不存在：$dir"
          exit 1
        fi
        count=$(find "$dir" -name '*.zip' | wc -l)
        echo "vcpkg 二进制缓存：$count 个包，$(du -sh "$dir" | cut -f1)，路径 $dir"
        if [ "$count" -eq 0 ]; then
          echo "::error::$dir 为空，依赖没有被缓存"
          exit 1
        fi

    - name: Build
      run: |
        cd build
        ninja -j$(nproc)

    - name: Run tests with UBSan
      working-directory: build
      env:
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        ctest --output-on-failure --verbose --output-junit junit.xml

    - name: Publish unit test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && hashFiles('build/junit.xml') != ''
      with:
        files: build/junit.xml
        check_name: Unit Test Results (UBSan)
        comment_title: Unit Test Report (UBSan)

  # Static Analysis with clang-tidy
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          clang-tidy \
          build-essential \
          git \
          pkg-config \
          ninja-build \
          python3 \
          python3-pip \
          python3-venv

    - name: Install Python test dependencies (Bolt integration tests)
      run: pip install neo4j pytest --break-system-packages

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        # 只缓存二进制包缓存（~/.cache/vcpkg/archives，约 1GB）：安装时 vcpkg 按 ABI 直接解包，
        # 不再源码重建依赖。vcpkg 工具目录由 actions/checkout 的 submodule 提供（固定 2cf2bcc），
        # 不缓存它 —— 其 buildtrees/packages/downloads 单次可达数 GB，会挤爆仓库 10GB 缓存额度，
        # 连带淘汰 ccache/基线等条目（这也是主键长期 miss 的原因之一）。
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-archives-clang-tidy-${{ hashFiles('vcpkg.json') }}
        # 主键一 miss（PR 缓存随 PR 关闭被删除、vcpkg.json 改动等）时回退到旧条目，
        # 避免从零源码重建；vcpkg 会按 ABI 校验每个包，回退只会部分复用，不会用错。
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-clang-tidy-

    - name: Bootstrap vcpkg
      # 直接用 submodule 里的 vcpkg（固定 2cf2bcc）就地 bootstrap，不再使用 lukka/run-vcpkg：
      # 该 action 会把 vcpkg 的二进制缓存接管到 GitHub Actions 的 x-gha 后端，而固定版本的
      # vcpkg 已移除 x-gha，依赖包因此从不写入 ~/.cache/vcpkg/archives（actions/cache 无内容
      # 可存，作业退化成每次源码重建全部依赖）。
      run: |
        if [ -f "vcpkg/vcpkg" ]; then
          echo "Using existing vcpkg binary"
        else
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        ./vcpkg/vcpkg version

    - name: Configure CMake and generate compile_commands.json
      run: |
        mkdir build
        cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Verify vcpkg binary cache
      # 判据：vcpkg 必须把编译好的依赖包写进默认的本地二进制缓存（~/.cache/vcpkg/archives），
      # 否则 actions/cache 无内容可存，作业会退化成每次源码重建全部依赖。
      run: |
        dir="$HOME/.cache/vcpkg/archives"
        if [ ! -d "$dir" ]; then
          echo "::error::vcpkg 二进制缓存目录不存在：$dir"
          exit 1
        fi
        count=$(find "$dir" -name '*.zip' | wc -l)
        echo "vcpkg 二进制缓存：$count 个包，$(du -sh "$dir" | cut -f1)，路径 $dir"
        if [ "$count" -eq 0 ]; then
          echo "::error::$dir 为空，依赖没有被缓存"
          exit 1
        fi

    - name: Run clang-tidy
      run: |
        find src tests \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) | head -20 | xargs clang-tidy \
          -p build \
          2>&1 | tee clang-tidy-output.txt

    - name: Upload clang-tidy results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-results
        path: clang-tidy-output.txt

  # Build with all warnings as errors

