<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EuGraph Web Console</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px auto;
      max-width: 1000px;
      color: #222;
      background: #f7f8fa;
    }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #667; margin-bottom: 20px; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }
    .field label { margin-bottom: 4px; color: #445; }
    input, textarea {
      padding: 8px 10px;
      border: 1px solid #ccd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    input { width: 180px; }
    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      padding: 9px 16px;
      border: 0;
      border-radius: 6px;
      background: #087f5b;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #495057; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    pre {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      min-height: 180px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
    .status {
      min-height: 18px;
      margin: 8px 0;
      font-size: 13px;
      color: #445;
    }
  </style>
</head>
<body>
  <h1>EuGraph Web Console</h1>
  <div class="subtitle">通过浏览器 WebSocket 直连 eugraph 的 Bolt 端口执行 Cypher。</div>

  <div class="row">
    <div class="field">
      <label>Host</label>
      <input id="host" value="localhost" />
    </div>
    <div class="field">
      <label>Bolt Port</label>
      <input id="port" value="7687" />
    </div>
    <div class="field">
      <label>Database</label>
      <input id="database" value="default" />
    </div>
    <div class="field">
      <label>Username</label>
      <input id="username" value="neo4j" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" value="eugraph" />
    </div>
    <button id="connectBtn">连接</button>
    <button id="disconnectBtn" class="secondary">断开</button>
  </div>

  <div class="status" id="status">未连接</div>

  <textarea id="query" spellcheck="false">RETURN 1 AS n</textarea>
  <div class="row" style="margin-top: 12px;">
    <button id="runBtn" disabled>执行</button>
  </div>

  <pre id="output">// 执行结果会显示在这里</pre>

  <script src="vendor/neo4j-web.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
